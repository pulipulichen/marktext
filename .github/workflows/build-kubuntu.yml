name: Manual Kubuntu 24.04 Build
run-name: Kubuntu 24.04 amd64 (${{ inputs.build_ref }})

on:
  workflow_dispatch:
    inputs:
      build_ref:
        description: Branch or tag to build
        required: true
        default: develop
        type: string

permissions:
  contents: write

jobs:
  linux-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.build_ref }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y icnsutils graphicsmagick xz-utils libx11-dev libxkbfile-dev gnome-keyring libsecret-1-dev libfontconfig-dev rpm xvfb xauth

      - uses: ./.github/actions/setup

      - name: Run postinstall
        run: pnpm tsx scripts/postinstall.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_user_agent: pnpm
          USE_ELECTRON_CLANG: '0'

      - name: Build Linux amd64 packages
        run: pnpm run build:linux:x64
        env:
          USE_ELECTRON_CLANG: '0'

      - name: Validate Debian package installation on Ubuntu 24.04
        shell: bash
        run: |
          set -euo pipefail
          packages=(dist/*.deb)
          test "${#packages[@]}" -eq 1
          test -f "${packages[0]}"
          test "$(dpkg-deb -f "${packages[0]}" Architecture)" = amd64
          package_name=$(dpkg-deb -f "${packages[0]}" Package)
          sudo apt-get update
          sudo apt-get install -y "./${packages[0]}"
          test "$(dpkg-query -W -f='${Status}' "$package_name")" = 'install ok installed'
          sudo apt-get check

      - name: Validate image toolbar with the system clipboard
        run: xvfb-run --auto-servernum pnpm -C packages/desktop exec playwright test test/e2e/image-toolbar-copy.spec.ts

      - name: Capture build metadata
        id: build-info
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=kubuntu-24.04-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Generate SHA256 checksums
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=( *.deb *.AppImage )
          test "${#packages[@]}" -gt 0
          printf '%s\n' "${packages[@]}" | LC_ALL=C sort | while IFS= read -r file; do
            sha256sum "$file"
          done > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Upload assets to a draft first, then publish it. This also works with
      # repositories that enforce immutable published releases.
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.build-info.outputs.tag }}
          target_commitish: ${{ steps.build-info.outputs.commit }}
          name: "Kubuntu 24.04 amd64 build #${{ github.run_number }}"
          body: |
            Manually triggered Kubuntu 24.04 amd64 build.

            - Source ref: `${{ inputs.build_ref }}`
            - Commit: `${{ steps.build-info.outputs.commit }}`
            - Workflow run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            Verify downloaded packages with:

            ```bash
            sha256sum -c SHA256SUMS.txt --ignore-missing
            ```
          draft: true
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/*.deb
            dist/*.AppImage
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.build-info.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease --repo "$GITHUB_REPOSITORY"
